# Fork-only: run the diffusion residency unit tests on CPU. Not for upstream.
name: fork-cpu-unit
on:
  push:
    branches: ["test-run/**"]
jobs:
  unit:
    if: github.repository_owner == 'Shreyasg13'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source: [branch, main]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Use main's source with this branch's tests (expect new tests to fail)
        if: matrix.source == 'main'
        run: |
          git fetch --depth=1 https://github.com/sgl-project/sglang.git 5cbf949839b1fc73802d20670943ccbeb805d3f2
          git checkout FETCH_HEAD -- python/sglang/multimodal_gen/runtime
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          uv venv /tmp/venv && . /tmp/venv/bin/activate
          uv pip install torch==2.14.1 torchvision --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e python --no-deps
          uv pip install pytest aiohttp "anthropic>=0.20.0" blobfile==3.0.0 build compressed-tensors==0.18.0 datasets             distro easydict einops fastapi gguf interegular IPython "llguidance>=1.7.6,<2.0.0" "mistral_common>=1.11.5"             modelscope msgspec ninja numba==0.65.1 numpy openai==2.6.1 openai-harmony==0.0.4 orjson outlines==0.1.11             packaging partial_json_parser pillow "prometheus-client>=0.20.0" psutil py-spy pybase64 pydantic             python-multipart "pyzmq>=25.1.2" regex requests scipy sentencepiece==0.2.1 setproctitle soundfile==0.13.1             tiktoken timm==1.0.16 tokenizers==0.23.2 tqdm transformers==5.19.0 uvicorn uvloop watchfiles xxhash zstandard             safetensors accelerate huggingface_hub diffusers==0.37.0 addict==2.4.0 av==16.1.0 cloudpickle==3.1.2             imageio==2.36.0 imageio-ffmpeg==0.5.1 msgpack opencv-python-headless==4.10.0.84 PyYAML==6.0.1             remote-pdb==2.1.0 websockets protobuf triton cache-dit==1.5.1 "moviepy>=2.0.0" scikit-image==0.25.2 \n            "trimesh>=4.0.0" xatlas "runai_model_streamer>=0.15.7"
      - name: Test
        run: |
          . /tmp/venv/bin/activate
          python -m pytest -q -p no:cacheprovider python/sglang/multimodal_gen/test/unit/test_component_residency.py 2>&1 | tail -80
          exit ${PIPESTATUS[0]}
